<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org/">
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<title>Insert title here</title>
</head>
<body> <!--/* 주석 */-->
	<div class="container text-center">
		<h3>사원 상세 조회</h3>
		<div>
			<div class="input-group mb-3">
				<label for="deptId" class="input-group-text">회사번호</label>
				<input class="form-control" id="deptId" type="text" th:value="${dept.departmentId}" readonly />
			</div>
			<div class="input-group mb-3">
				<label for="dname" class="input-group-text">회사이름</label>
				<input class="form-control" id="dname" type="text" th:value="${dept.departmentName}" readonly />
			</div>
			<div class="input-group mb-3">
				<label for="mId" class="input-group-text">관리자코드</label>
				<input class="form-control" id="mId" type="text" th:value="${dept.managerId}" readonly />
			</div>
			<div class="input-group mb-3">
				<label for="lId" class="input-group-text" >지역코드</label>
				<input class="form-control" id="lId" type="text" th:value="${dept.locationId}" readonly />
			</div>
			<div>
				<button type="button" class="btn btn-secondary">수정</button>
				<button type="button" class="btn btn-primary">목록</button>
				<button type="button" class="btn btn-danger">삭제</button>
			</div>
		</div>
	</div>
	<script>
		/* let location_href = "/empDelete?empId=${emp.employeeId}" */
	</script>
</body>
</html>
