<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org/" 
				xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
				layout:decorate="~{common\layouts\default_layout}"
				layout:fragment="Content">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<!--/* 요즘엔 테이블태그 잘 안쓴다는데 귀찮으니까 일단쓰꼐요 */-->
	<div class="container text-center">
		<h3>전체 사원 조회</h3>
		<table class="table border ">
			<thead>
				<tr>
					<th>No.</th>
					<th>사원번호</th>
					<th>이름</th>
					<th>입사일자</th>
					<th>업무</th>
				</tr>
			</thead>
			<tbody>
					<!-- <tr	th:onclick="|location.href='@{/empInfo(employeeId=${info.employeeId})}'|"> -->
				<th:block th:each="info, status : ${emps}">
					<tr>
						<td>[[ ${status.count} ]]</td>
						<td>[[ ${info.employeeId} ]]</td>
						<td>[[ ${info.lastName} ]]</td>
						<td>[[ ${#dates.format(info.hireDate, "yyyy년MM월dd일")} ]]</td>
						<td>[[ ${info.jobId} ]]</td>
					</tr>
				</th:block>
			</tbody>
		</table>
	</div>
	<script>
		let contextPath = document.querySelector('meta[name="ctxPath"]').getAttribute('value') ?? '';
		document.querySelectorAll('tbody tr')
						.forEach(trTag => {
							trTag.addEventListener('click',(e) => {
								let trTag = e.currentTarget;
								let eId = trTag.querySelector('td:nth-of-type(2)').textContent;
								let url = contextPath + '/empInfo?employeeId=' + eId;
								location.href = url;
							});
						});
	</script>
</body>
</html>
